# 拓扑图模板

# 元信息
name: ""                  # 拓扑名称
version: "1.0"
created_at: ""
updated_at: ""

# 服务器列表
servers:
  - id: ""
    alias: ""

# 连接列表
connections:
  - from: ""
    to: ""
    type: "direct"        # direct/tunnel/vpn/proxy/jump
    via: null             # 跳板服务器（可选）
    status: "active"      # active/inactive/error/testing

# 路由策略
routing:
  default_via: null       # 默认跳板
  fallback_enabled: true  # 启用备选路径
  auto_optimize: true     # 自动优化路径